# koji-hub httpd config (RHEL/Rocky layout)
# python3-mod_wsgi already provides the LoadModule in conf.modules.d

# Send Apache access/error logs to stderr so they are captured
# by the container and visible via `docker logs koji-hub`.
ErrorLog /dev/stderr
CustomLog /dev/stderr combined
LogLevel warn

Alias /kojihub /usr/share/koji-hub/kojiapp.py

<Directory "/usr/share/koji-hub">
    Options ExecCGI
    SetHandler wsgi-script
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptReloading Off
    Require all granted
</Directory>

# Also serve /mnt/koji (build output / file storage)
Alias /kojifiles "/mnt/koji/"

<Directory "/mnt/koji">
    Options Indexes SymLinksIfOwnerMatch FollowSymLinks
    AllowOverride None
    IndexOptions +NameWidth=*
    Require all granted
</Directory>