[hub]

##  Basic options  ##
DBName = koji
DBUser = koji
DBHost = db
DBPort = 5432
DBPass = koji

# Whether new users are created when they first log in.
LoginCreatesUser = On

# The web interface URL (used for email links, etc.)
KojiWebURL = http://web/koji

# auth: allow username/password (default) and turn off strict
# This image ships with password auth enabled by default.

# Koji top directory symlinked into the container
KojiDir = /mnt/koji

# Consider the default realm
AllowedKrbRealms = *

##  Logging options  ##
# Log level for the hub application. Write to stderr so it appears
# in the container's stdout/stderr (visible via `docker logs koji-hub`).
LogLevel = INFO

# Custom log format with request context (method, user, IP, process).
LogFormat = '%(asctime)s [%(levelname)s] m=%(method)s u=%(user_name)s p=%(process)s r=%(remoteaddr)s %(name)s: %(message)s'
