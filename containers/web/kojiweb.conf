# koji-web httpd config (RHEL/Rocky layout)
# python3-mod_wsgi already provides the LoadModule in conf.modules.d

# Send Apache access/error logs to stderr so they are captured by the
# container and visible via `docker compose logs web`. Without this they go
# to httpd's default paths inside the image and are effectively lost.
ErrorLog /dev/stderr
CustomLog /dev/stderr combined
LogLevel warn

# Use WSGI
Alias /koji "/usr/share/koji-web/scripts/wsgi_publisher.py"

WSGIDaemonProcess koji lang=C.UTF-8

<Directory "/usr/share/koji-web/scripts/">
    Options ExecCGI
    SetHandler wsgi-script
    WSGIProcessGroup koji
    WSGIApplicationGroup %{GLOBAL}
    Require all granted
</Directory>

Alias /koji-static/ "/usr/share/koji-web/static/"

<Directory "/usr/share/koji-web/static/">
    Options None
    AllowOverride None
    Require all granted
</Directory>