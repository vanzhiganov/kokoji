[web]

SiteName = Koji Web

KojiHubURL = http://hub/kojihub

KojiFilesURL = http://hub/kojifiles

# Password authentication via web form
WebAuthType = password

# Allow self-registration
AllowRegistration = On

# Secret used to sign auth cookies. Override via KOJI_WEB_SECRET env in production.
Secret = change-me-secret

##  Logging  ##
# LogLevel accepts a single level name, or a series of "logger:LEVEL" pairs
# that are applied in order. Bare names prefix to "koji.", so "INFO" means
# "koji:INFO". Useful per-logger tuning:
#   LogLevel = WARNING koji.auth:INFO koji.web:INFO
# INFO is what makes login/registration events visible; they log at INFO via
# the koji.auth logger, so WARNING (the default) hides them entirely.
LogLevel = INFO
LogFormat = %(asctime)s [%(levelname)s] m=%(method)s u=%(user_name)s r=%(remoteaddr)s %(name)s: %(message)s

# Show full python tracebacks in the response body (not for production)
# PythonDebug = True

# Add the requested page to the value map
LibPath = /usr/share/koji-web/lib
