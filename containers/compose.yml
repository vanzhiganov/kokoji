services:
  # Build-only helper. Every other service extends this image via
  # `FROM koji-base:latest`, so it has to exist locally before they can build.
  # Compose does not order builds from depends_on, so build it explicitly:
  #   docker compose build base
  base:
    build:
      context: ..
      dockerfile: containers/base/Dockerfile
    image: koji-base:latest
    command: ["true"]
    restart: "no"

  db:
    build:
      context: ..
      dockerfile: containers/db/Dockerfile
    image: koji-db:latest
    container_name: koji-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koji}
      POSTGRES_USER: ${POSTGRES_USER:-koji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koji}
    volumes:
      - koji-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koji} -d ${POSTGRES_DB:-koji}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  hub:
    build:
      context: ..
      dockerfile: containers/hub/Dockerfile
    image: koji-hub:latest
    container_name: koji-hub
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${POSTGRES_HOST:-db}
      DB_NAME: ${POSTGRES_DB:-koji}
      DB_USER: ${POSTGRES_USER:-koji}
      DB_PASS: ${POSTGRES_PASSWORD:-koji}
      DB_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - koji-storage:/mnt/koji
    ports:
      - "80:80"
    healthcheck:
      # Deliberately not /kojihub: the XML-RPC app answers 405 to GET
      # (kojihub/kojixmlrpc.py rejects non-POST), so that would fail forever.
      # /kojifiles is a plain Apache alias over the shared volume.
      test: ["CMD-SHELL", "curl -sf http://localhost/kojifiles/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: containers/web/Dockerfile
    image: koji-web:latest
    container_name: koji-web
    depends_on:
      hub:
        condition: service_healthy
    environment:
      HUB_URL: ${HUB_URL:-http://hub/kojihub}
      FILES_URL: ${FILES_URL:-http://hub/kojifiles}
      WEB_SECRET: ${WEB_SECRET:-change-me-secret}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-On}
      # Bare level name, or "logger:LEVEL" pairs, e.g. "WARNING koji.auth:INFO"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - koji-storage:/mnt/koji:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/koji/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kojira:
    build:
      context: ..
      dockerfile: containers/kojira/Dockerfile
    image: koji-kojira:latest
    container_name: koji-kojira
    depends_on:
      hub:
        condition: service_healthy
    environment:
      KOJIRA_SERVER: ${HUB_URL:-http://hub/kojihub}
      KOJIRA_TOPDIR: /mnt/koji
      KOJIRA_USER: ${KOJIRA_USER:-kojira}
      KOJIRA_PASSWORD: ${KOJIRA_PASSWORD:-kojira}
    volumes:
      - koji-storage:/mnt/koji
    restart: unless-stopped

volumes:
  koji-db-data:
  koji-storage:
