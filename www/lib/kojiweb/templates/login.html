{% extends "base.html" %}
{% block content %}


  <div class="pageHeader">Login</div>

  <div id="loginForm">
    {% if loginError %}
    <p class="error" role="alert">{{ loginError }}</p>
    {% endif %}
    <form action="login" method="post">
      <input type="hidden" name="a" value="{{ authToken }}"/>
      <input type="hidden" name="page" value="{{ page }}"/>
      <div class="cds--form-item">
        <label class="cds--label" for="username">Username:</label>
        <input type="text" id="username" name="username" class="cds--text-input"/>
      </div>
      <div class="cds--form-item">
        <label class="cds--label" for="password">Password:</label>
        <input type="password" id="password" name="password" class="cds--text-input"/>
      </div>
      <div class="cds--form-item">
        <input type="submit" class="cds--btn cds--btn--primary" value="Login"/>
      </div>
    </form>
    {% if AllowRegistration %}
    <p>Don't have an account? <a href="register">Register</a></p>
    {% endif %}
  </div>

{% endblock %}
