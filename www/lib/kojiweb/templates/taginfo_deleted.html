{% extends "base.html" %}
{% block content %}


  <h4>Information for deleted tag <a href="taginfo?tagID={{ tag.id }}">{{ tag.name }}</a></h4>

  <div class="cds--structured-list">
    <div class="cds--structured-list-tbody">
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">Name</div>
        <div class="cds--structured-list-td">{{ tag.name }}</div>
      </div>
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">ID</div>
        <div class="cds--structured-list-td">{{ tag.id }}</div>
      </div>
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">Deleted</div>
        <div class="cds--structured-list-td">{{ util.formatTimeLong(delete_ts) }}</div>
      </div>
    </div>
  </div>

{% endblock %}
