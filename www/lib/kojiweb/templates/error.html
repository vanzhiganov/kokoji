{% extends "base.html" %}
{% block content %}


  <h4>Error</h4>

  <div class="cds--inline-notification cds--inline-notification--error" role="alert">
    <div class="cds--inline-notification__details">
      <p class="cds--inline-notification__subtitle">{{ explanation }}</p>
    </div>
  </div>

  {% if debug_level >= 1 %}
  <p>{{ tb_short }}</p>
  {% endif %}

  {% if tb_long %}
  <pre class="cds--snippet cds--snippet--multi"><code>{{ tb_long }}</code></pre>
  {% endif %}

{% endblock %}
