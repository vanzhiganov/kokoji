{% extends "base.html" %}
{% block content %}


  <h2 class="pageHeader">Information for target <a href="buildtargetinfo?targetID={{ target.id }}">{{ target.name }}</a></h2>

  <div class="cds--structured-list">
    <div class="cds--structured-list-tbody">
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">Name</div>
        <div class="cds--structured-list-td">{{ target.name }}</div>
      </div>
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">ID</div>
        <div class="cds--structured-list-td">{{ target.id }}</div>
      </div>
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">Build Tag</div>
        <div class="cds--structured-list-td"><a href="taginfo?tagID={{ buildTag.id }}">{{ buildTag.name }}</a></div>
      </div>
      <div class="cds--structured-list-row">
        <div class="cds--structured-list-td">Destination Tag</div>
        <div class="cds--structured-list-td"><a href="taginfo?tagID={{ destTag.id }}">{{ destTag.name }}</a></div>
      </div>
    </div>
  </div>

  {% if 'admin' in perms %}
  <div class="cds--btn-set">
    <a class="cds--btn cds--btn--secondary cds--btn--sm" href="buildtargetedit?targetID={{ target.id }}{{ koji_authToken() }}">Edit</a>
    <a class="cds--btn cds--btn--danger--tertiary cds--btn--sm" href="buildtargetdelete?targetID={{ target.id }}{{ koji_authToken() }}">Delete</a>
  </div>
  {% endif %}

{% endblock %}
