[koji]
authtype = password
user = admin
password = admin

;configuration for koji cli tool

;url of XMLRPC server
server = http://localhost/kojihub

;url of web interface
weburl = http://localhost:8080/koji

;url of package download site
;pkgurl = http://localhost/packages

;path to the koji top directory
;topdir = /mnt/koji


;configuration for password authentication
;user and password are read from this profile; --user and --password override them
;if password is not set anywhere, koji asks for it interactively
;keep this file readable only by you (chmod 0600), the password is stored in plain text

;configuration for SSL authentication

;client certificate
;cert = ~/.koji/client.crt

;certificate of the CA that issued the HTTP server certificate
;serverca = ~/.koji/serverca.crt

;plugin paths, separated by ':' as the same as the shell's PATH
;koji_cli_plugins module and ~/.koji/plugins are always loaded in advance,
;and then be overridden by this option
;plugin_paths = ~/.koji/plugins

;[not_implemented_yet]
;enabled plugins for CLI, runroot and save_failed_tree are available
;plugins =

;timeout of XMLRPC requests by seconds, default: 60 * 60 * 12 = 43200
;timeout = 43200

;timeout of SSL authentication by seconds, default: 60
;auth_timeout = 60

;enforcing CLI authentication even for anonymous calls
;force_auth = False
