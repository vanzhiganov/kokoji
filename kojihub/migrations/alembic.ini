# Alembic configuration for the Koji hub database.
#
# The database URL is resolved by env.py from the hub configuration
# (/etc/koji-hub/hub.conf by default).  Overrides:
#   -x url=postgresql+psycopg2://...   explicit database URL
#   -x config=/path/to/hub.conf        alternate hub config file
#   KOJI_HUB_CONFIG / KOJI_HUB_CONFIG_DIR environment variables

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
