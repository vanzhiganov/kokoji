# Example inventory for the deploy role.
#
# `koji_db` exists only so the hub can derive its DBHost. PostgreSQL is NOT
# installed or configured by this role -- it must already be running, with
# schemas/schema.sql loaded and the admin/kojira users seeded.
#
[koji_hub]
koji-hub01 ansible_host=192.0.2.10

[koji_web]
koji-web01 ansible_host=192.0.2.11

[koji_kojira]
koji-kojira01 ansible_host=192.0.2.12

[koji_builder]
koji-builder01 ansible_host=192.0.2.13

[koji_vm]
koji-vm01 ansible_host=192.0.2.14

[koji_db]
koji-db01 ansible_host=192.0.2.20

[koji_servers:children]
koji_hub
koji_web
koji_kojira
koji_builder
koji_vm
