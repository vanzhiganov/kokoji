---
# Optional database bootstrap, run via bootstrap-db.yml with
# `tasks_from: bootstrap-db`. PostgreSQL is otherwise out of scope for the
# deploy role; this file exists for local/all-in-one deployments only.
- name: Install PostgreSQL packages
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
      - acl
    state: present

- name: Initialize the PostgreSQL data directory
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION

# Keeps --check usable on a fresh host: initdb is skipped in check mode, so
# postgresql.conf may not exist when the lineinfile tasks run.
- name: Check that postgresql.conf exists
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/postgresql.conf
  register: koji_pg_conf

# The web app connects to the hub as 'koji' over TCP, so password auth must
# use SCRAM (EL's default host rules are ident/peer based).
- name: Configure PostgreSQL host authentication
  ansible.builtin.copy:
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
    content: |
      # Managed by deploy/bootstrap-db.yml for the local Koji database.
      local   all             all                                     peer
      host    all             all             127.0.0.1/32            scram-sha-256
      host    all             all             ::1/128                 scram-sha-256
      local   replication     all                                     peer
      host    replication     all             127.0.0.1/32            scram-sha-256
      host    replication     all             ::1/128                 scram-sha-256
  notify: Restart postgresql

- name: Configure PostgreSQL password encryption
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: '^#?password_encryption\s*='
    line: "password_encryption = scram-sha-256"
    owner: postgres
    group: postgres
    mode: "0600"
  when: koji_pg_conf.stat.exists
  notify: Restart postgresql

# Every Apache worker talking to the hub holds one DB connection. Keep the
# limit below what kojira and ad-hoc psql sessions need.
- name: Configure PostgreSQL connection limit
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: '^#?max_connections\s*='
    line: "max_connections = {{ koji_postgres_max_connections }}"
    owner: postgres
    group: postgres
    mode: "0600"
  when: koji_pg_conf.stat.exists
  notify: Restart postgresql

- name: Start and enable PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started
  when: not ansible_check_mode or koji_pg_conf.stat.exists

- name: Flush handlers before bootstrapping
  ansible.builtin.meta: flush_handlers

- name: Ensure the Koji PostgreSQL role exists
  become_user: postgres
  ansible.builtin.shell: |
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ koji_db_user }}'" | grep -q 1 || \
      psql -v ON_ERROR_STOP=1 -c "CREATE USER {{ koji_db_user }} WITH PASSWORD '{{ koji_db_password }}';"
    psql -v ON_ERROR_STOP=1 -c "ALTER USER {{ koji_db_user }} WITH PASSWORD '{{ koji_db_password }}';"
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Ensure the Koji PostgreSQL database exists
  become_user: postgres
  ansible.builtin.shell: |
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname='{{ koji_db_name }}'" | grep -q 1 || \
      psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{ koji_db_name }} OWNER {{ koji_db_user }};"
  args:
    executable: /bin/bash
  changed_when: false

- name: Check whether the Koji schema is loaded
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ koji_db_name }} -tAc "SELECT to_regclass('public.users') IS NOT NULL;"
  register: koji_schema_loaded
  changed_when: false

# Stage as root: the synced source tree may not be traversable by the postgres
# user (schemas/ mode 0744 on some hosts).
- name: Stage the Koji schema SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../schemas/schema.sql"
    dest: /tmp/koji-schema.sql
    owner: root
    group: root
    mode: "0644"
  when: koji_schema_loaded.stdout.strip() != 't'

- name: Load the Koji schema
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -v ON_ERROR_STOP=1 -d {{ koji_db_name }} -f /tmp/koji-schema.sql
  when: koji_schema_loaded.stdout.strip() != 't'
  changed_when: true

- name: Grant Koji database privileges
  become_user: postgres
  ansible.builtin.shell: |
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -d {{ koji_db_name }} <<'SQL'
    GRANT ALL PRIVILEGES ON DATABASE {{ koji_db_name }} TO {{ koji_db_user }};
    GRANT USAGE, CREATE ON SCHEMA public TO {{ koji_db_user }};
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ koji_db_user }};
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ koji_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ koji_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ koji_db_user }};
    SQL
  args:
    executable: /bin/bash
  changed_when: false

- name: Seed the Koji admin, kojira and builder users
  become: true
  block:
    - name: Stage the seed SQL
      ansible.builtin.template:
        src: seed-users.sql.j2
        dest: /tmp/koji-seed-users.sql
        owner: postgres
        group: postgres
        mode: "0600"
      no_log: true

    - name: Apply the seed SQL
      become_user: postgres
      ansible.builtin.command:
        cmd: psql -v ON_ERROR_STOP=1 -d {{ koji_db_name }} -f /tmp/koji-seed-users.sql
      changed_when: false

  always:
    - name: Remove the staged seed SQL
      ansible.builtin.file:
        path: /tmp/koji-seed-users.sql
        state: absent
