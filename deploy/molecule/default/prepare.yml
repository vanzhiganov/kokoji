---
# EPEL, CRB, systemd and the dnf metadata cache are baked into the image by
# Dockerfile.j2. This playbook only verifies the prerequisites, keeping the
# prepare/converge/idempotence cycle fast.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check that the dnf Python bindings are available
      ansible.builtin.raw: python3 -c "import dnf; print(dnf.__version__)"
      changed_when: false

    - name: List enabled repositories
      ansible.builtin.command:
        cmd: dnf -q repolist enabled
      changed_when: false
      register: koji_repolist

    - name: Assert that EPEL and CRB are enabled
      ansible.builtin.assert:
        that:
          - "'epel' in koji_repolist.stdout"
          - "'crb' in koji_repolist.stdout"
        fail_msg: "EPEL and CRB must be enabled (see Dockerfile.j2)."
        quiet: true
