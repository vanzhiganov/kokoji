---
- name: Restart httpd
  ansible.builtin.systemd_service:
    name: "{{ koji_httpd_service }}"
    state: restarted

- name: Restart kojira
  ansible.builtin.systemd_service:
    name: "{{ koji_kojira_service }}"
    state: restarted

- name: Restart kojid
  ansible.builtin.systemd_service:
    name: "{{ koji_kojid_service }}"
    state: restarted

- name: Restart kojivmd
  ansible.builtin.systemd_service:
    name: "{{ koji_kojivmd_service }}"
    state: restarted
